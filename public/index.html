<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoLocation</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e3a5f);
            color: white;
            padding: 30px 20px;
        }

        .container {
            max-width: 850px;
            margin: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .header p {
            color: #cbd5e1;
        }

        .identity {
            background: rgba(255, 255, 255, 0.08);
            padding: 15px 20px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .identity p {
            margin: 5px 0;
        }

        .search-box {
            background: white;
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 25px;
        }

        .search-box h2 {
            color: #0f172a;
            margin-bottom: 15px;
        }

        .search-form {
            display: flex;
            gap: 10px;
        }

        #locationInput {
            flex: 1;
            padding: 14px;
            border: 2px solid #dbeafe;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        button {
            padding: 14px 25px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #message {
            text-align: center;
            margin-bottom: 20px;
        }

        .result-card {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 25px;
        }

        .result-card h2 {
            margin-bottom: 10px;
        }

        #locationName {
            color: #93c5fd;
            font-size: 28px;
            margin-bottom: 20px;
        }

        .details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .detail {
            background: rgba(0, 0, 0, 0.2);
            padding: 18px;
            border-radius: 12px;
        }

        .detail span {
            display: block;
            color: #cbd5e1;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .detail strong {
            font-size: 17px;
        }

        footer {
            text-align: center;
            margin-top: 25px;
            color: #94a3b8;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .search-form {
                flex-direction: column;
            }

            .details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🌍 GeoLocation</h1>
        <p>Mencari informasi lokasi menggunakan MapTiler API</p>
    </div>

    <div class="identity">
        <p><strong>Nama:</strong> Drivandi Pratama</p>
        <p><strong>NIM:</strong> 20240140061</p>
    </div>

    <div class="search-box">
        <h2>🔎 Cari Lokasi</h2>

        <form class="search-form" id="searchForm">
            <input
                type="text"
                id="locationInput"
                placeholder="Contoh: Yogyakarta"
                required
            >

            <button type="submit">Cari Lokasi</button>
        </form>
    </div>

    <p id="message"></p>

    <div class="result-card">

        <h2>📍 Detail Lokasi</h2>

        <h3 id="locationName">Belum ada lokasi</h3>

        <div class="details">

            <div class="detail">
                <span>Negara</span>
                <strong id="country">-</strong>
            </div>

            <div class="detail">
                <span>Provinsi</span>
                <strong id="province">-</strong>
            </div>

            <div class="detail">
                <span>Kecamatan</span>
                <strong id="district">-</strong>
            </div>

            <div class="detail">
                <span>Longitude</span>
                <strong id="longitude">-</strong>
            </div>

            <div class="detail">
                <span>Latitude</span>
                <strong id="latitude">-</strong>
            </div>

        </div>
    </div>

    <footer>
        Praktikum Pengembangan Web Service · MapTiler API
    </footer>

</div>

<script>

    const searchForm = document.getElementById("searchForm");

    searchForm.addEventListener("submit", async function(event) {

        event.preventDefault();

        const location = document.getElementById("locationInput").value;

        const message = document.getElementById("message");

        message.textContent = "Sedang mencari lokasi...";

        try {

            const response = await fetch(
                `/api/lokasi?kota=${encodeURIComponent(location)}`
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.message);
            }

            document.getElementById("locationName").textContent =
                data.lokasi;

            document.getElementById("country").textContent =
                data.negara;

            document.getElementById("province").textContent =
                data.provinsi;

            document.getElementById("district").textContent =
                data.kecamatan;

            document.getElementById("longitude").textContent =
                data.longitude;

            document.getElementById("latitude").textContent =
                data.latitude;

            message.textContent = "Data lokasi berhasil ditemukan ✓";

        } catch (error) {

            console.error(error);

            message.textContent =
                "Gagal mengambil data lokasi.";

        }

    });

</script>

</body>
</html>
