<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Location Finder</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            color: white;
            padding: 40px 20px;
        }

        .container {
            max-width: 850px;
            margin: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 38px;
            margin-bottom: 10px;
        }

        .header p {
            color: #cbd5e1;
        }

        .identity {
            text-align: center;
            margin-top: 15px;
            color: #cbd5e1;
            font-size: 14px;
        }

        .search-box {
            background: white;
            padding: 20px;
            border-radius: 15px;
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .search-box input {
            flex: 1;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        .search-box button {
            padding: 14px 25px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .search-box button:hover {
            background: #1d4ed8;
        }

        .result {
            background: white;
            color: #0f172a;
            border-radius: 15px;
            padding: 25px;
        }

        .result h2 {
            margin-bottom: 20px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .info-card {
            background: #f1f5f9;
            padding: 18px;
            border-radius: 12px;
        }

        .info-card span {
            display: block;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 7px;
        }

        .info-card strong {
            font-size: 17px;
        }

        @media (max-width: 600px) {
            .search-box {
                flex-direction: column;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>Location Finder</h1>
            <p>Temukan informasi lokasi menggunakan MapTiler API</p>

            <div class="identity">
                Nama: Drivandi Pratama | NIM: 20240140061
            </div>
        </div>

        <div class="search-box">
            <input
                type="text"
                id="locationInput"
                placeholder="Masukkan nama kota..."
            >

            <button id="searchButton">
                Cari Lokasi
            </button>
        </div>

        <div class="result">

            <h2 id="locationName">Hasil Lokasi</h2>

            <div class="info-grid">

                <div class="info-card">
                    <span>Negara</span>
                    <strong id="country">-</strong>
                </div>

                <div class="info-card">
                    <span>Provinsi</span>
                    <strong id="province">-</strong>
                </div>

                <div class="info-card">
                    <span>Kecamatan</span>
                    <strong id="district">-</strong>
                </div>

                <div class="info-card">
                    <span>Longitude</span>
                    <strong id="longitude">-</strong>
                </div>

                <div class="info-card">
                    <span>Latitude</span>
                    <strong id="latitude">-</strong>
                </div>

            </div>

        </div>

    </div>

    <script>
        const searchButton = document.getElementById("searchButton");
        const locationInput = document.getElementById("locationInput");

        searchButton.addEventListener("click", async () => {
            const location = locationInput.value.trim();

            if (!location) {
                alert("Masukkan nama lokasi terlebih dahulu!");
                return;
            }

            try {
                const response = await fetch(
                    `/api/lokasi?kota=${encodeURIComponent(location)}`
                );

                const data = await response.json();

                if (!response.ok) {
                    alert(data.message);
                    return;
                }

                document.getElementById("locationName").textContent =
                    data.lokasi;

                document.getElementById("country").textContent =
                    data.negara;

                document.getElementById("province").textContent =
                    data.provinsi;

                document.getElementById("district").textContent =
                    data.kecamatan;

                document.getElementById("longitude").textContent =
                    data.longitude;

                document.getElementById("latitude").textContent =
                    data.latitude;

            } catch (error) {
                console.error(error);
                alert("Gagal mengambil data lokasi.");
            }
        });
    </script>

</body>
</html>
